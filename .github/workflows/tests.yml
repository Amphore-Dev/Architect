name: 🧪 Run Tests

on:
    pull_request:
    push:
        branches: [main]
    # called by the publish workflow before publishing
    workflow_call:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # corepack before setup-node, so its yarn cache uses yarn 4
            - run: corepack enable
            - uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
                  cache: "yarn"
            - run: corepack enable
            - run: yarn install --immutable
            - run: yarn lint
            - run: yarn typecheck

    test:
        # paths, separators and symlinks differ between systems
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node: ["22.x", "24.x"]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            # corepack before setup-node, so its yarn cache uses yarn 4
            - run: corepack enable
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: "yarn"
            - run: corepack enable
            - run: yarn install --immutable
            - run: yarn test
