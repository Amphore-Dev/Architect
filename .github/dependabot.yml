version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          # one PR for all the minor/patch updates
          dependencies:
              update-types: ["minor", "patch"]
      open-pull-requests-limit: 10

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
